
name: frontend
on:
  push:
    paths:
      - "frontend/javascript/frontend.js"

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: cd frontend/javascript && npm ci
      - name: Check syntax by running
        run: cd frontend/javascript && node frontend.js