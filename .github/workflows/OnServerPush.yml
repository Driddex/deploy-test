name: Server Checker

on:
  workflow_dispatch:
    inputs:
      ServerOrClient:
        required: true
        description: Server/Client/Output
        type: choice
        options:
          - Server
          - Client
          - Output
        default: "Server"
  push:
    paths:
      - 'api/api.py'
      - 'frontend/javascript/frontend.js'

jobs:
  Server:
    runs-on: ubuntu-latest
    if: ${{ inputs.ServerOrClient == 'Server' || github.event_name == 'push'}}
    steps:
      - name: dowload repository
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5 
        with:
          python-version: "3.11"

      - name: If Error
        if: ${{ failure() }}
        run: echo error

      - name: run compileall
        run: python -m compileall api/
      
      - name: If error
        if: ${{ failure() }}
        run: echo Error failed to compileall server
    
      - name: print
        run: |
          echo succesfully compilealled api/
          echo for: ${{ github.repository_owner }} repository
      
      - name: Compose Docker
        run: |
          docker compose up -d --build
        
      - name: chmod x
        run: chmod +x api/bashCmds/ServerTester.sh

      - name: check server is alive
        if: ${{ always() }}
        run: api/bashCmds/ServerTester.sh
      
      - name: Docker Compose down
        if: ${{ always() }}
        run: |
          docker compose down
          echo succesfully turned off docker compose

  Client:
    runs-on: ubuntu-latest
    if: ${{ inputs.ServerOrClient == 'Client' || github.event_name == 'push'}}
    steps:
      - name: Dowload repository
        uses: actions/checkout@v4
  Rep:
    runs-on: ubuntu-latest
    if: ${{ inputs.ServerOrClient == 'Output' }}
    steps:
      - name: output info
        run: |
          echo Repository: ${{ github.repository }}
          echo Owner name: ${{ github.repository_owner }}
          echo Owner id: ${{ github.repository_owner_id }}
          echo Link: ${{ github.repositoryUrl }}
      - name: if error
        if: ${{ failure() }}
        run: echo failed to give repository information

