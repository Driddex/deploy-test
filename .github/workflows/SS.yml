name: ss
env:
  CHECKER: '${{ github.repository_owner }}'

on:
  workflow_dispatch:
    inputs:
      OwnerOutputer:
        type: boolean
        default: true
        description: Print repository owner username
        required: false

jobs:
  ss:
    runs-on: ubuntu-latest
    steps:
      - name: ggwp
        id: context
        run: |
          echo '${{ env.CHECKER }}'