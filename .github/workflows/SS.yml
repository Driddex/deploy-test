name: ss

env:
  CHECKER: '${{ github.repository_owner }}'
  Numb: 1
  Numb2: 1

on:
  workflow_dispatch:
    inputs:
      OwnerOutputer:
        type: boolean
        default: true
        description: Print repository owner username
        required: false

jobs:
  ss:
    runs-on: ubuntu-latest
    steps:
      - name: ggwp
        id: context
        run: |
          echo '${{ env.CHECKER }}'
          echo '${{ env.Numb }}' + '${{ env.Numb2 }}'