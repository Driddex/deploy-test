name: Forkflow
on: 
  workflow_run:
    workflows: [checker]
    types:
      - completed
  issues:
    types: [edited,deleted]

jobs:
  hellocmd:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: say
        run: echo finished got forkflow finished
  failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: failure
        run: echo failed
  
  issues:
    runs-on: ubuntu-latest
    steps:
      - name: issues
        uses: actions/checkout@v4