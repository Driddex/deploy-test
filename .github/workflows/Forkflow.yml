name: Forkflow
on: 
  workflow_run:
    workflows: [checker]
    types:
      - completed

jobs:
  hellocmd:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: say
        run: echo finished got forkflow finished
  failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: failure
        run: echo failed