name: dispatch
on:
  workflow_dispatch:
    inputs:
      Information:
        required: true
        description: Write a reason
        type: string
        default: Test
      Choicer:
        required: false
        description: test
        type: choice
        options:
          - Hi
          - Bye
        default: "Hi"
      boolean:
        type: boolean
        description: GG WP?
        required: false
        default: false
  
  push:
    paths:
      - "api/api.py"

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ inputs.Choicer == 'Hi' }}
    steps:
      - name: success
        run: echo GGWP

  runTest:
    runs-on: ubuntu-latest
    if: ${{ inputs.Information == 'Test'}}
    steps:
      - name: success
        run: |
          echo "Title: ${{ inputs.Information }}"
          echo Succesfully runned a workflow dispatch

  runChecker:
    runs-on: ubuntu-latest
    if: ${{ inputs.Information == 'Checker'}}
    steps:
      - name: Checker
        run: echo Starting a server check for code errors

      - name: dowload a repository
        uses: actions/checkout@v4

      - name: dowload python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: check for errors
        run: python -m compileall api/
    
          