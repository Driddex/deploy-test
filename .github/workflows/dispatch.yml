name: dispatch
on:
  workflow_dispatch:
    inputs:
      Information:
        required: true
        description: Write a reason
        type: string
        default: Test

jobs:
  runTest:
    runs-on: ubuntu-latest
    if: ${{ inputs.Information == 'Test'}}
    steps:
      - name: success
        run: |
          echo "Title: ${{ inputs.Information }}"
          echo Succesfully runned a workflow dispatch

  runChecker:
    runs-on: ubuntu-latest
    if: ${{ inputs.Information == 'Test'}}
    steps:
      - name: Checker
        run: echo Test

    
          