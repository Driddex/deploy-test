name: dispatch
on:
  workflow_dispatch:
    inputs:
      Information:
        required: true
        description: Check Client/Server?
        type: string
        default: Test
      Choicer:
        required: false
        description: choice
        type: choice
        options:
          - ggwp
          - ez ez
        default: "ggwp"
      boolean:
        type: boolean
        description: GG WP?
        required: false
        default: false
  
  push:
    paths:
      - "api/api.py"

jobs:
  CodeChecker:
    if: ${{ inputs.Information == 'Server'}}
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dowload
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        
      - name: check for errors
        run: python -m compileall api/
    
          
          