version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0208_password
      POSTGRES_DB: demo
    ports:
      - "8120:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data 

  backend1:
    build: ./api
    container_name: backend1
    env_file:
      - .env
    depends_on:
      - db

  backend2:
    build: ./api
    container_name: backend2
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: frontend-client

  nginx:
    image: nginx:alpine
    container_name: nginx-balancer
    ports:
      - "80:80"
    volumes:
      - ./my-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2

volumes:
  pgdata: